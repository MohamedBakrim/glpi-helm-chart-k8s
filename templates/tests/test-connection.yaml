apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "MyHelm.fullname" . }}-test-connection"
  labels:
    {{- include "MyHelm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # <fullname> is the nginx Service (HTTP on 80) — NOT the php-fpm
      # FastCGI Service on 9000, which wget cannot talk to.
      args: ['{{ include "MyHelm.fullname" . }}:{{ .Values.nginx.service.port }}']
  restartPolicy: Never
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
