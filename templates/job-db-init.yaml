{{- if .Values.jobs.dbInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "MyHelm.fullname" . }}-glpi-install
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "MyHelm.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-db
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          command: [sh, -c, 'until nc -z $MARIADB_HOST $MARIADB_PORT; do sleep 2; done']
          envFrom: [{configMapRef: {name: {{ include "MyHelm.fullname" . }}-glpi-config}}]
      containers:
        - name: install
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          workingDir: /var/www/html
          command: [sh, -c, '/usr/local/bin/glpi-db-install.sh && /usr/local/bin/glpi-db-upgrade.sh']
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - {configMapRef: {name: {{ include "MyHelm.fullname" . }}-glpi-config}}
          env:
            - name: MARIADB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.mariadb.auth.existingSecret }}, key: mariadb-user-password}}
          volumeMounts:
            - {name: etc-data, mountPath: /etc/glpi}
            - {name: files-data, mountPath: /var/lib/glpi}
            - {name: marketplace-data, mountPath: {{ .Values.marketplacePersistence.mountPath }}}
      volumes:
        {{- include "MyHelm.dataVolume" (dict "name" "etc-data" "claimName" (printf "%s-etc" (include "MyHelm.fullname" .)) "enabled" .Values.etcPersistence.enabled) | nindent 8 }}
        {{- include "MyHelm.dataVolume" (dict "name" "files-data" "claimName" (printf "%s-files" (include "MyHelm.fullname" .)) "enabled" .Values.filesPersistence.enabled) | nindent 8 }}
        {{- include "MyHelm.dataVolume" (dict "name" "marketplace-data" "claimName" (printf "%s-marketplace" (include "MyHelm.fullname" .)) "enabled" .Values.marketplacePersistence.enabled) | nindent 8 }}
{{- end }}