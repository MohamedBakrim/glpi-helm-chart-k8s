{{- if .Values.adCa.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "MyHelm.fullname" . }}-ad-ca
  labels:
    {{- include "MyHelm.labels" . | nindent 4 }}
    app.kubernetes.io/component: php-fpm
data:
  # Self-signed DC certs (not a CA) — the merge init container APPENDS these
  # to the image's system bundle, so public trust stays intact.
  ad-ca.crt: |
{{ .Values.adCa.certs | indent 4 }}
{{- end }}
