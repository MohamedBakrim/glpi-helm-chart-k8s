{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "MyHelm.fullname" . }}-backup
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "MyHelm.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml (.Values.backup.accessModes | default (list "ReadWriteOnce")) | nindent 4 }}
  {{- with .Values.backup.storageClass }}
  storageClassName: {{ if eq . "-" }}{{ "" | quote }}{{ else }}{{ . | quote }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.size }}
{{- end }}