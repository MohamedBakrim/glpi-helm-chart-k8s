apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "MyHelm.fullname" . }}-nginx
  labels:
    {{- include "MyHelm.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
data:
  default.conf: |
    server {
      listen 80;
      # Catch-all: with no server_name, $server_name is empty and FastCGI gets
      # SERVER_NAME="", which confuses apps building absolute URLs.
      server_name _;
      root /var/www/html/public;
      index index.php;
      location / {
        try_files $uri /index.php$is_args$args;
      }
      location ~ ^/index\.php$ {
        fastcgi_pass {{ include "MyHelm.fullname" . }}-phpfpm:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Forward the original client Host / scheme through the proxy hops so
        # PHP sees the real DNS name (not "localhost"/the service name) and
        # knows the request was HTTPS.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port if_not_empty;
      }
    }